<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MZHX — Digital Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ctext x='16' y='23' font-size='18' font-family='Arial' font-weight='bold' fill='%23fff' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app">

  <!-- LEFT: black panel with MZHX -->
  <section id="leftPanel">
  </section>
  <div id="logoBox">
    <span class="hl" data-i="0"><span class="self">M</span></span>
    <span class="hl" data-i="1"><span class="self">Z</span></span>
    <span class="hl" data-i="2"><span class="self">H</span></span>
    <span class="hl" data-i="3"><span class="self"><span class="swing">X</span><i class="joint"></i></span></span>
    <!-- whole-word limelight overlay: clipped spotlights own the resting look while
         the wordmark sits on the left; geometry mirrors the .hl letters exactly, so
         this must stay on ONE line (whitespace between inline-blocks adds glyph gaps) -->
    <span class="mz-word" aria-hidden="true"><span class="mw">M</span><span class="mw">Z</span><span class="mw">H</span><span class="mw"><span class="swing">X</span><i class="joint"></i></span></span>
  </div>

  <!-- Curvy animated divider river: svg only carries hidden geometry; water is canvas-painted -->
  <svg id="divider" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <path id="dPath" d="M 50 -2 C 45.5 14, 54.5 27, 50 41 C 46.5 53, 47.5 63, 50 75 C 52.5 85, 53.5 92, 50 102" fill="none" stroke="none" opacity="0" />
  </svg>

  <!-- the river itself: procedural top-down water, painted on canvas (river.js) -->
  <canvas id="riverCanvas" aria-hidden="true"></canvas>

  <!-- little boat riding down the river (art: boat.svg) -->
  <div id="riverBoat" aria-hidden="true">
    <img src="boat.svg" alt="" draggable="false" />
  </div>

  <!-- RIGHT: content stage (scroll driven) -->
  <section id="rightPanel">
    <div id="svcLayer"></div>

    <div id="grillWrap" class="posbase">
      <span class="bcenter"><h2 id="grill">10+ years of grilling</h2></span>
    </div>

    <div id="flowLayer">
      <div id="flowGroup">
        <div id="encap"></div>
        <svg id="arrow1" class="arrow" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="planBox" class="box"><span class="bl"><span class="bli">Plan</span></span></div>
        <div id="designBox" class="box"><span class="bl"><span class="bli">Design</span></span></div>
      </div>
      <svg id="arrow2" class="arrow" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="execWrap" class="posbox"><div id="exec"><span class="bl"><span class="bli">Execution</span></span></div></div>
      <div id="testerBox" class="box"><span class="bl"><span class="bli">Testing</span></span></div>
      <svg id="arrow3" class="arrow" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="publishBox" class="box">
        <div class="pile"><i></i><i></i><i></i><i></i></div>
        <span class="bl"><span class="bli">Publish</span></span>
      </div>
      <svg id="arrow4" class="arrow" xmlns="http://www.w3.org/2000/svg"></svg>
      <svg id="arrow5" class="arrow" xmlns="http://www.w3.org/2000/svg"></svg>
      <svg id="arrow6" class="arrow" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="fbGroup">
        <div class="users"><i></i><i></i><i></i></div>
        <span class="bl"><span class="bli">Feedback</span></span>
      </div>
      <div id="improveBox" class="box"><span class="bl"><span class="bli">Improve</span></span></div>
    </div>

    <!-- next sections (works / stats / finale) — re-parented to viewport scope -->
    <div id="nextLayer"></div>

    <div id="ows" class="posbase">
      <span class="bcenter"><h2 id="owsText"></h2></span>
    </div>
    <!-- full-width section layer (re-parented: ows + flow live here) -->
    <div id="fullLayer"></div>
  </section>

  <div id="scrollHint"><i></i><em>scroll</em></div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/river.js"></script>
<script src="js/timelines.js"></script>
<script src="js/app.js"></script>
</body>
</html>

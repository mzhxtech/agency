<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MZHX — Digital Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Ctext x='16' y='23' font-size='18' font-family='Arial' font-weight='bold' fill='%23fff' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="app">

  <!-- LEFT: black panel with MZHX -->
  <section id="leftPanel">
  </section>
  <div id="logoBox">
    <span class="hl" data-i="0"><span class="self">M</span></span>
    <span class="hl" data-i="1"><span class="self">Z</span></span>
    <span class="hl" data-i="2"><span class="self">H</span></span>
    <span class="hl" data-i="3"><span class="self"><span class="swing">X</span><i class="joint"></i></span></span>
  </div>

  <!-- Curvy animated divider line -->
  <svg id="divider" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="dgrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3f3f46">
          <animate attributeName="stop-color" values="#3f3f46;#8a8a95;#3f3f46" dur="6s" repeatCount="indefinite" />
        </stop>
        <stop offset="50%" stop-color="#e4e4e9">
          <animate attributeName="stop-color" values="#b9b9c6;#ffffff;#b9b9c6" dur="6s" repeatCount="indefinite" />
        </stop>
        <stop offset="100%" stop-color="#3f3f46">
          <animate attributeName="stop-color" values="#3f3f46;#8a8a95;#3f3f46" dur="6s" repeatCount="indefinite" />
        </stop>
      </linearGradient>
    </defs>
    <path id="dBase" pathLength="1" d="M 49.5 -2 C 45.5 14, 54.5 27, 50.5 41 C 47.5 53, 46.5 63, 51.5 75 C 55 85, 53 92, 49.8 102" />
    <path id="dFlow" pathLength="1" d="M 49.5 -2 C 45.5 14, 54.5 27, 50.5 41 C 47.5 53, 46.5 63, 51.5 75 C 55 85, 53 92, 49.8 102" />
  </svg>

  <!-- RIGHT: content stage (scroll driven) -->
  <section id="rightPanel">
    <div id="svcLayer"></div>

    <div id="grillWrap" class="posbase">
      <span class="bcenter"><h2 id="grill">10+ years of grilling</h2></span>
    </div>

    <div id="flowLayer">
      <div id="flowGroup">
        <div id="encap"></div>
        <svg id="arrow1" class="arrow" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="planBox" class="box"><span class="bl"><span class="bli">Plan</span></span></div>
        <div id="designBox" class="box"><span class="bl"><span class="bli">Design</span></span></div>
      </div>
      <svg id="arrow2" class="arrow" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="execWrap" class="posbox"><div id="exec"><span class="bl"><span class="bli">Execution</span></span></div></div>
      <div id="testerBox" class="box"><span class="bl"><span class="bli">Testing</span></span></div>
    </div>

    <div id="ows" class="posbase">
      <span class="bcenter"><h2 id="owsText"></h2></span>
    </div>
    <!-- full-width section layer (re-parented: ows + flow live here) -->
    <div id="fullLayer"></div>
  </section>

  <div id="scrollHint"><i></i><em>scroll</em></div>
</div>

<script src="vendor/gsap.min.js"></script>
<script src="js/layout.js"></script>
<script src="js/timelines.js"></script>
<script src="js/app.js"></script>
</body>
</html>
